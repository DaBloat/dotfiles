# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# App Specific

# Foot Terminal
bind=SUPER,Return,spawn,foot

# Zen Browser
bind=SUPER,b,spawn,zen-browser

# Visual Studio Code
bind=SUPER,c,spawn,code

# Thunar File Manager
bind=SUPER,e,spawn,thunar

# Open Brodcasting Software
bind=SUPER,o,spawn,obs

# Scripts Specific

# Screenshot / Snip
bind=SUPER+SHIFT,s,spawn,~/.config/mango/scripts/snip

# exit
bind=SUPER+SHIFT,m,quit
bind=SUPER,q,killclient,

# Focus onto the next
bind=SUPER,Tab,focusstack,next

# switch window focus (Arrow Keys)
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

